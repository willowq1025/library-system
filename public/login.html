<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>图书管理系统 - 登录</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .demo-account {
            margin-top: 20px;
            padding: 12px 16px;
            background: #f0f4ff;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            line-height: 1.8;
            text-align: left;
            border: 1px dashed #c9d4f6;
        }
        .demo-account strong {
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-box">
        <h2 id="boxTitle">图书管理系统</h2>
        <div class="msg" id="msg"></div>
        <input id="username" placeholder="用户名" />
        <input id="password" type="password" placeholder="密码" />
        <button id="submitBtn">登 录</button>
        <div class="switch">
            <span id="switchText">没有账号？</span>
            <a id="switchLink">立即注册</a>
        </div>

        <!-- 测试账号提示区域 -->
        <div class="demo-account">
            <div><strong>演示账号提示：</strong></div>
            <div>管理员账号：<strong>admin</strong> / 密码：<strong>123456</strong></div>
            <div>普通用户账号：<strong>user</strong> / 密码：<strong>123456</strong></div>
        </div>

    </div>
</div>

<script src="js/api.js"></script>
<script>
    let isLogin = true;
    const msg = document.getElementById('msg');
    const boxTitle = document.getElementById('boxTitle');
    const submitBtn = document.getElementById('submitBtn');
    const switchText = document.getElementById('switchText');
    const switchLink = document.getElementById('switchLink');

    // 如果已登录，直接跳转
    if (getToken()) {
        const u = getUser();
        location.href = u.role === 'admin' ? 'admin.html' : 'index.html';
    }

    function showMsg(text, type) {
        msg.textContent = text;
        msg.className = 'msg ' + (type || '');
    }

    switchLink.onclick = () => {
        isLogin = !isLogin;
        boxTitle.textContent = isLogin ? '图书管理系统' : '注册新账号';
        submitBtn.textContent = isLogin ? '登 录' : '注 册';
        switchText.textContent = isLogin ? '没有账号？' : '已有账号？';
        switchLink.textContent = isLogin ? '立即注册' : '去登录';
        showMsg('');
    };

    submitBtn.onclick = async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) return showMsg('请输入用户名和密码', 'error');

        try {
            if (isLogin) {
                const data = await api('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                setAuth(data.token, data.user);
                location.href = data.user.role === 'admin' ? 'admin.html' : 'index.html';
            } else {
                await api('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                showMsg('注册成功，请登录', 'ok');
                switchLink.onclick();
            }
        } catch (err) {
            showMsg(err.message, 'error');
        }
    };

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitBtn.click();
    });
</script>
</body>
</html>
